<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設備清單 | UptimeIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10141a;
    --surface: #1a2028;
    --surface-2: #212934;
    --line: #2a323d;
    --text: #e7ebf0;
    --text-dim: #8b96a5;
    --accent: #2dd4bf;
    --warn: #f5a623;
    --crit: #ef5350;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .wordmark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .wordmark span { color: var(--accent); }
  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .topnav {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 13px;
  }
  .topnav a {
    color: var(--text-dim);
    text-decoration: none;
  }
  .topnav a.active { color: var(--accent); }
  .topnav a:hover { color: var(--text); }
  #userTag {
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    border-left: 1px solid var(--line);
    padding-left: 20px;
  }
  main { padding: 32px 40px; }
  .toolbar {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    align-items: center;
  }
  select, input {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-left: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--surface);
    border-radius: 8px;
    overflow: hidden;
  }
  th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-weight: 500;
  }
  td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface-2); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    border: 1px solid var(--line);
    color: var(--text-dim);
  }
  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 6px;
  }
  .status-dot.inactive { background: var(--text-dim); }
  .machine-id {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
    font-size: 12px;
  }
  .empty, .loading, .error {
    padding: 60px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }
  .error { color: var(--crit); }
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">Uptime<span>IQ</span></div>
    <div class="subtitle">預防性保養與妥善率智慧平台</div>
  </div>
  <nav class="topnav">
    <a href="machines.html" class="active">設備清單</a>
    <a href="maintenance-form.html">填寫紀錄</a>
    <a href="pm-schedule.html">保養排程</a>
    <a href="analytics.html" id="navAnalytics">績效分析</a>
    <a href="product-overview.html">產品定位</a>
    <span id="userTag"></span>
    <a href="#" id="logoutLink">登出</a>
  </nav>
</header>

<main>
  <div class="toolbar">
    <select id="categoryFilter">
      <option value="">全部設備類別</option>
    </select>
    <div class="count" id="rowCount"></div>
  </div>

  <table>
    <thead>
      <tr>
        <th>設備名稱</th>
        <th>類別</th>
        <th>型號 / 製造商</th>
        <th>位置</th>
        <th>基準保養週期</th>
        <th>狀態</th>
      </tr>
    </thead>
    <tbody id="machineTableBody">
      <tr><td colspan="6" class="loading">載入中…</td></tr>
    </tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
  let allMachines = [];

  async function requireLogin() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return null;
    }
    return session;
  }

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabaseClient.auth.signOut();
    sessionStorage.clear();
    window.location.href = 'index.html';
  });

  async function loadMachines() {
    const tbody = document.getElementById('machineTableBody');
    const { data, error } = await supabaseClient
      .from('machine_master')
      .select('*')
      .order('machine_name');

    if (error) {
      tbody.innerHTML = `<tr><td colspan="6" class="error">讀取失敗：${error.message}</td></tr>`;
      return;
    }

    allMachines = data;
    populateCategoryFilter(data);
    renderTable(data);
  }

  function populateCategoryFilter(machines) {
    const select = document.getElementById('categoryFilter');
    const categories = [...new Set(machines.map(m => m.equipment_category))];
    categories.forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      select.appendChild(opt);
    });
  }

  function renderTable(machines) {
    const tbody = document.getElementById('machineTableBody');
    document.getElementById('rowCount').textContent = `共 ${machines.length} 台設備`;

    if (machines.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">目前沒有符合條件的設備</td></tr>`;
      return;
    }

    tbody.innerHTML = machines.map(m => `
      <tr>
        <td>
          <div>${m.machine_name}</div>
          <div class="machine-id">#${m.id}</div>
        </td>
        <td><span class="badge">${m.equipment_category ?? '—'}</span></td>
        <td>${m.model ?? '—'} / ${m.manufacturer ?? '—'}</td>
        <td>${m.location ?? '—'}</td>
        <td>${m.base_pm_cycle_days ? m.base_pm_cycle_days + ' 天' : '—'}</td>
        <td><span class="status-dot ${m.status !== 'active' ? 'inactive' : ''}"></span>${m.status ?? '—'}</td>
      </tr>
    `).join('');
  }

  document.getElementById('categoryFilter').addEventListener('change', (e) => {
    const val = e.target.value;
    const filtered = val ? allMachines.filter(m => m.equipment_category === val) : allMachines;
    renderTable(filtered);
  });

  (async () => {
    const session = await requireLogin();
    if (!session) return;
    document.getElementById('userTag').textContent = sessionStorage.getItem('uptimeiq_name') || session.user.email;
    if (sessionStorage.getItem('uptimeiq_role') !== 'admin') {
      document.getElementById('navAnalytics').style.display = 'none';
    }
    loadMachines();
  })();
</script>

</body>
</html>
