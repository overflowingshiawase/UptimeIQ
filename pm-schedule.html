<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保養排程 | UptimeIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10141a; --surface: #1a2028; --line: #2a323d;
    --text: #e7ebf0; --text-dim: #8b96a5;
    --accent: #2dd4bf; --warn: #f5a623; --crit: #ef5350;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; }
  header { padding:28px 40px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  .wordmark { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; }
  .wordmark span { color:var(--accent); }
  .subtitle { font-size:13px; color:var(--text-dim); margin-top:4px; }
  .topnav { display:flex; align-items:center; gap:20px; font-size:13px; }
  .topnav a { color:var(--text-dim); text-decoration:none; }
  .topnav a.active { color:var(--accent); }
  .topnav a:hover { color:var(--text); }
  #userTag { color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:12px; border-left:1px solid var(--line); padding-left:20px; }
  main { padding:32px 40px; }
  .formula-note {
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:16px 20px; margin-bottom:24px; font-size:13px; color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace; line-height:1.6;
  }
  .formula-note b { color:var(--accent); }
  .toolbar { display:flex; justify-content:flex-end; margin-bottom:16px; }
  button.recalc {
    background:var(--accent); color:#0a1210; border:none; padding:9px 18px;
    border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;
  }
  button.recalc:disabled { opacity:0.6; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; background:var(--surface); border-radius:8px; overflow:hidden; }
  th { text-align:left; font-size:11px; text-transform:uppercase; color:var(--text-dim); padding:12px 16px; border-bottom:1px solid var(--line); font-weight:500; }
  td { padding:14px 16px; border-bottom:1px solid var(--line); font-size:14px; }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-family:'IBM Plex Mono',monospace; border:1px solid var(--line); }
  .badge.overdue { color:var(--crit); border-color:var(--crit); }
  .badge.pending { color:var(--accent); border-color:var(--accent); }
  .factor-down { color:var(--warn); }
  .empty, .loading { padding:60px 0; text-align:center; color:var(--text-dim); font-size:14px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">Uptime<span>IQ</span></div>
    <div class="subtitle">預防性保養與妥善率智慧平台</div>
  </div>
  <nav class="topnav">
    <a href="machines.html">設備清單</a>
    <a href="maintenance-form.html">填寫紀錄</a>
    <a href="pm-schedule.html" class="active">保養排程</a>
    <a href="analytics.html" id="analyticsLink">績效分析</a>
    <span id="userTag"></span>
    <a href="#" id="logoutLink">登出</a>
  </nav>
</header>

<main>
  <div class="formula-note">
    下次保養日 = 上次保養日 ＋（基準週期天數 × 調整係數）　|　調整係數：<b>近期MTBF小於自身基準保養週期 → 0.6</b>（代表故障速度已快過原訂保養節奏），<b>近90天內出現Critical故障 → 再乘0.8</b>，其餘維持 <b>1.0</b>
  </div>

  <div class="toolbar">
    <button class="recalc" id="recalcBtn">重新計算保養排程</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>設備</th>
        <th>近期 MTBF</th>
        <th>調整係數</th>
        <th>基準週期</th>
        <th>上次保養</th>
        <th>下次建議保養日</th>
        <th>狀態</th>
      </tr>
    </thead>
    <tbody id="scheduleBody">
      <tr><td colspan="7" class="loading">載入中…</td></tr>
    </tbody>
  </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script>
  async function requireLogin() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return null; }
    return session;
  }

  document.getElementById('logoutLink').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabaseClient.auth.signOut();
    sessionStorage.clear();
    window.location.href = 'index.html';
  });

  async function computeAndRender() {
    const tbody = document.getElementById('scheduleBody');
    tbody.innerHTML = `<tr><td colspan="7" class="loading">計算中…</td></tr>`;

    const [{ data: machines, error: mErr }, { data: records, error: rErr }, { data: schedules, error: sErr }] = await Promise.all([
      supabaseClient.from('machine_master').select('id, machine_name, base_pm_cycle_days'),
      supabaseClient.from('maintenance_record').select('machine_id, start_time, fault_type_id, fault_type(severity_level)').eq('record_type', 'CM'),
      supabaseClient.from('pm_schedule').select('*')
    ]);

    if (mErr || rErr || sErr) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty">讀取失敗：${(mErr||rErr||sErr).message}</td></tr>`;
      return;
    }

    const byMachine = {};
    records.forEach(r => { (byMachine[r.machine_id] ||= []).push(r); });

    const mtbfMap = {};
    Object.entries(byMachine).forEach(([mid, recs]) => {
      const sorted = recs.map(r => new Date(r.start_time)).sort((a,b) => a - b);
      if (sorted.length < 2) { mtbfMap[mid] = null; return; }
      const totalDays = (sorted[sorted.length - 1] - sorted[0]) / (1000 * 60 * 60 * 24);
      mtbfMap[mid] = totalDays / (sorted.length - 1);
    });

    const validMtbfs = Object.values(mtbfMap).filter(v => v !== null);
    const overallAvg = validMtbfs.length ? validMtbfs.reduce((a,b) => a+b, 0) / validMtbfs.length : null;

    const rows = [];
    for (const m of machines) {
      const mtbf = mtbfMap[m.id] ?? null;
      let factor = 1.0;
      // 修正：改用「近期MTBF 是否小於自身基準保養週期」判斷，
      // 不再跟全廠平均比較（樣本數少時，跟平均比較會失真）
      if (mtbf !== null && m.base_pm_cycle_days && mtbf < m.base_pm_cycle_days) factor = 0.6;

      const ninetyDaysAgo = new Date(); ninetyDaysAgo.setDate(ninetyDaysAgo.getDate() - 90);
      const hasCritical = (byMachine[m.id] || []).some(r =>
        r.fault_type?.severity_level === 'Critical' && new Date(r.start_time) >= ninetyDaysAgo
      );
      if (hasCritical) factor *= 0.8;

      const schedule = schedules.find(s => s.machine_id === m.id);
      const lastPm = schedule?.last_pm_date ? new Date(schedule.last_pm_date) : new Date();
      const nextDue = new Date(lastPm);
      nextDue.setDate(nextDue.getDate() + Math.round((m.base_pm_cycle_days || 90) * factor));
      const status = nextDue < new Date() ? 'overdue' : 'pending';

      if (schedule) {
        await supabaseClient.from('pm_schedule').update({
          calculated_mtbf: mtbf,
          adjustment_factor: factor,
          next_pm_due_date: nextDue.toISOString().slice(0, 10),
          status
        }).eq('id', schedule.id);
      }

      rows.push({ name: m.machine_name, mtbf, factor, base: m.base_pm_cycle_days, lastPm, nextDue, status });
    }

    renderRows(rows);
  }

  function renderRows(rows) {
    const tbody = document.getElementById('scheduleBody');
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="7" class="empty">沒有設備資料</td></tr>`; return; }
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>${r.name}</td>
        <td>${r.mtbf !== null ? r.mtbf.toFixed(1) + ' 天' : '資料不足'}</td>
        <td class="${r.factor < 1 ? 'factor-down' : ''}">${r.factor.toFixed(2)}</td>
        <td>${r.base ?? '—'} 天</td>
        <td>${r.lastPm.toLocaleDateString('zh-TW')}</td>
        <td>${r.nextDue.toLocaleDateString('zh-TW')}</td>
        <td><span class="badge ${r.status}">${r.status === 'overdue' ? '已逾期' : '待保養'}</span></td>
      </tr>
    `).join('');
  }

  document.getElementById('recalcBtn').addEventListener('click', async () => {
    const btn = document.getElementById('recalcBtn');
    btn.disabled = true;
    await computeAndRender();
    btn.disabled = false;
  });

  (async () => {
    const session = await requireLogin();
    if (!session) return;
    document.getElementById('userTag').textContent = sessionStorage.getItem('uptimeiq_name') || session.user.email;

    const { data: profile } = await supabaseClient.from('user_profiles').select('role').eq('id', session.user.id).single();
    if (profile?.role !== 'admin') document.getElementById('analyticsLink').style.display = 'none';

    await computeAndRender();
  })();
</script>

</body>
</html>
